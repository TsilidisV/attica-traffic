version: 2

models:
  - name: fct_measurements
    description: |
      Processed traffic metrics derived from the staging table stg_traffic.
      Contains device identifiers, processing timestamps, and traffic metrics.
    columns:
      - name: device_id
        description: Unique identifier for the traffic device.
        tests:
          - not_null

      - name: processed_at
        description: Timestamp when the record was processed.
        tests:
          - not_null
      - name: processed_year
        description: Year extracted from processed_at.

      - name: processed_month
        description: Month extracted from processed_at.

      - name: processed_day
        description: Day name (e.g., Monday) derived from processed_at.

      - name: processed_hour
        description: Hour of day extracted from processed_at (00:00 - 23:00).

      - name: ingested_at
        description: Timestamp when the raw record was ingested into the system.
        tests:
          - not_null

      - name: counted_cars
        description: Number of cars counted in the measurement interval.
        tests:
          - not_null

      - name: average_speed
        description: Average vehicle speed for the measurement interval.
        tests:
          - not_null

  - name: dim_roads
    description: |
      Normalized road names and road metadata derived from stg_traffic.
      Applies mapping rules to standardize Greek road names.
    columns:
      - name: device_id
        description: Unique identifier for the traffic device.
        tests:
          - not_null

      - name: road_name
        description: Normalized road name after applying mapping rules (e.g., 'Λ. ΑΘΗΝΩΝ' -> 'ΑΘΗΝΩΝ').
        tests:
          - not_null

      - name: road_info
        description: Additional metadata or descriptive information about the road.

