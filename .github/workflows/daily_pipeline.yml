name: Daily Pipeline

on:
  schedule:
    # Every day at 05:12 UTC 
    - cron: '12 05 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"
        
      - name: Ingest Data
        # Using --package to tell uv which environment context to use
        run: uv run --package attica-ingestion python ingestion/ingestion.py ingest-daily

      - name: Run dbt Transformations
        run: |
          uv run --package attica-transform dbt deps --project-dir transform
          uv run --package attica-transform dbt build --project-dir transform --profiles-dir transform --target prod