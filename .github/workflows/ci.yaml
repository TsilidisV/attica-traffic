name: CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
# JOB 0: The Traffic Director (Detects what changed)
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # These outputs are passed to the 'if' statements of the jobs below
      dashboard: ${{ steps.filter.outputs.dashboard }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dashboard:
              - 'dashboard/**'
              - 'pyproject.toml'
              - 'uv.lock'
            api:
              - 'api/**'
              - 'config.yaml'
              - 'pyproject.toml'
              - 'uv.lock'

  # JOB 1: Read-only, purely for testing
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Secure default
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The fast way to set up uv
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true # Caches dependencies so future runs take seconds!

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      # Run the test suite
      - name: Run Pytest
        run: uv run --all-packages pytest tests/

  # JOB 2: Write-enabled, only runs if tests pass, only on push (not PRs)
  generate-requirements:
    runs-on: ubuntu-latest
    needs: [test, detect-changes] # Waits for the 'test' job to succeed!
    # ONLY run if it's a push to master AND the dashboard files were modified
    if: github.event_name == 'push' && needs.detect-changes.outputs.dashboard == 'true'
    permissions:
      contents: write # Needed to push code
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
        
      - name: Generate requirements.txt
        run: uv export --package attica-dashboard --no-hashes > dashboard/requirements.txt
        
      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update dashboard/requirements.txt"
          file_pattern: dashboard/requirements.txt