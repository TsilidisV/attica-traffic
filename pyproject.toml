[project]
name = "attica-traffic"
version = "0.1.0"
description = "End-to-end traffic data pipeline and ML model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "api",
    "dashboard",
    "ingestion",
    "transform",
    "ml_pipeline"
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "httpx>=0.28.1",
    "python-dotenv>=0.9.9"
]